<body>

    <section aria-label="une section pour un formulaire de contact" class="form">

        </h1>

          <label>Nom</label>
          <input aria-label="c'est un input pour mettre le nom" type="text" placeholder="Nom">
          <label>Prénom</label>

        <label>Email</label>

          <label>Messages</label>

     </div>
